version: '3.8'

services:
  # Base de données immuable pour le Ledger
  postgres:
    image: postgres:16-alpine
    container_name: binary_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: binary-db
      POSTGRES_PASSWORD: 6r5g1z561g65e1r56zg1er156161et

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Cache pour l'Idempotence et les sessions de connexion rapide
  redis:
    image: redis:7-alpine
    container_name: binary_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: