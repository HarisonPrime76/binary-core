services:
  postgres:
    image: postgres:16-alpine
    container_name: binary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binary_owner
      POSTGRES_PASSWORD: owner_secret_password
      POSTGRES_DB: binary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binary_owner -d binary_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binary-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://binary_app:prime7610@postgres:5432/binary_db?sslmode=disable"
      JWT_SECRET: "binary_super_secret_jwt_key_minimum_32_chars_2026"
      APPROVAL_THRESHOLD: "10000.0000"

volumes:
  postgres_data:
