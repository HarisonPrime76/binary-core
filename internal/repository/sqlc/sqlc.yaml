version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../../../migrations/"
    gen:
      go:
        package: "postgres"
        out: "../postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "://github.com"
              type: "Decimal"
          - db_type: "uuid"
            go_type:
              import: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "uuid"
              type: "UUID"
              pointer: true
